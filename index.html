<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <header class="flex justify-between">
            <nav class="w-[30%]">
                <ul class="flex">
                    <li class="text-lg cursor-pointer font-bold"><a href="/">Home</a></li>
                    <li class="text-lg cursor-pointer"><a href="/">About Us</a></li>
                    <li class="text-lg cursor-pointer"><a href="/">Services</a></li>
                    <li class="text-lg cursor-pointer"><a href="/">Contact Us</a></li>
                </ul>
            </nav>
            <div class="logo w-[20%] self-center">
                <h1 class="text-2xl">Dream Agency</h1>
            </div>
            <div class="contact w-[15%]">
                <button class="btn-facebook">
                    <img src="img/facebook-icon.svg" class="facebook-icon" alt="facebook">
                </button>
                <button class="btn-linkedin">
                    <img src="img/linkedin-icon.svg" class="linkedin-icon" alt="linkedin">
                </button>
                <button class="btn-instagram">
                    <img src="img/instagram-icon.svg" class="instagram-icon" alt="instagram">
                </button>
            </div>
        </header>
        <main>

        </main>
        <footer>

        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
